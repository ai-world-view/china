  <text x="580" y="790" text-anchor="middle" font-family="serif" font-size="18" fill="#5c3d1e" opacity="0.7" font-style="italic">Four Moral Sprouts (四端)</text>

  
  <rect x="300" y="100" width="820" height="200" rx="6" fill="#3a2410" opacity="0.08" />
  
  <text x="710" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="#3a2410" letter-spacing="6">MENCIUS</text>
  <text x="710" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#7a5c32" letter-spacing="8">MENGZI  ·  372–289 BCE</text>
  <text x="710" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7a5c32" opacity="0.8" font-style="italic">Second Sage of Confucianism  ·  Architect of Human Goodness</text>

  
  <line x1="300" y1="310" x2="1200" y2="310" stroke="#7a5c32" stroke-width="1.5" opacity="0.5" />
  <circle cx="750" cy="310" r="6" fill="#7a5c32" opacity="0.5" />
  <circle cx="300" cy="310" r="4" fill="#7a5c32" opacity="0.4" />
  <circle cx="1200" cy="310" r="4" fill="#7a5c32" opacity="0.4" />

  
  <text x="710" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5c3d1e" opacity="0.85">
    <tspan font-style="italic">ren</tspan> (humaneness)  ·  Human Nature is Good  ·  Mandate of Heaven  ·  Moral Cultivation
  </text>

  
  <circle cx="1200" cy="450" r="10" fill="#8b4513" opacity="0.6" />
  <circle cx="1200" cy="450" r="18" fill="none" stroke="#8b4513" stroke-width="1.5" opacity="0.5" />
  <text x="1230" y="455" font-family="serif" font-size="16" fill="#5c3d1e" opacity="0.8" font-style="italic">State of Zou</text>
