  <rect x="80" y="340" width="680" height="50" fill="#7a6535" opacity="0.2" rx="2" />
  <text x="420" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3a1a08" letter-spacing="3" font-style="italic">c. 2070 – 1600 BCE  ·  China's First Dynasty</text>

  
  <line x1="118" y1="310" x2="780" y2="310" stroke="#7a6535" stroke-width="1.5" opacity="0.6" />
  <line x1="118" y1="314" x2="780" y2="314" stroke="#7a6535" stroke-width="0.5" opacity="0.4" />

  
  <text x="760" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a1a08" font-style="italic" opacity="0.75">Yu the Great</text>
  <line x1="760" y1="432" x2="760" y2="450" stroke="#5a3a10" stroke-width="1" opacity="0.6" />

  
  <text x="550" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a4a5a" font-style="italic" opacity="0.7">— flood channels —</text>

  
