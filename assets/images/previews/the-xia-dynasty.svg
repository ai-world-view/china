<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Xia Dynasty — Ancient China's First Dynasty Banner</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b0" />
      <stop offset="100%" stop-color="#c9b87a" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5c9a8" />
      <stop offset="100%" stop-color="#d4c98a" />
    </linearGradient>
    <linearGradient id="watergrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fa8b8" />
      <stop offset="100%" stop-color="#5e8fa0" />
    </linearGradient>
    <linearGradient id="mountaingrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a5a" />
      <stop offset="100%" stop-color="#6b5c3a" />
