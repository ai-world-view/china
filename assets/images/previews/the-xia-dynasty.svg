      <line x1="0" y1="0" x2="0" y2="8" stroke="#7a6a4a" stroke-width="0.4" opacity="0.3" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#7a6a4a" stroke-width="0.4" opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" opacity="0.3" />

  
