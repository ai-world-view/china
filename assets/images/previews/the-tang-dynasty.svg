  <text x="400" y="670" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#3a2008" text-anchor="middle" letter-spacing="2">The Tang</text>
  <text x="400" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#3a2008" text-anchor="middle" letter-spacing="2">Dynasty</text>

  
  <rect x="200" y="800" width="400" height="4" fill="#8b1a1a" opacity="0.6" />
