<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Tang Dynasty – Golden Age of Chinese Civilization</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b5" />
      <stop offset="100%" stop-color="#c9b87a" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5c9d9" />
      <stop offset="100%" stop-color="#e8d9b5" />
    </linearGradient>
    <linearGradient id="silkgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c47a2b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c47a2b" stop-opacity="0" />
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a8956a" stroke-width="0.5" opacity="0.4" />
    </pattern>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
    </filter>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#parchment)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
  <rect width="1536" height="1024" fill="none" stroke="#7a5c2a" stroke-width="24" opacity="0.5" />
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a5c2a" stroke-width="3" opacity="0.4" />

  

  
  <path d="M 300,250 Q 400,210 550,230 Q 700,200 900,220 Q 1100,180 1250,240 Q 1350,280 1400,350 Q 1420,420 1380,480 Q 1300,520 1200,510 Q 1100,540 1000,520 Q 850,560 700,530 Q 550,560 420,510 Q 320,480 280,420 Q 250,360 300,250 Z" fill="#b5a06a" opacity="0.6" />

  
  <path d="M 680,290 Q 780,260 900,270 Q 1020,250 1100,300 Q 1160,350 1140,430 Q 1100,490 1020,510 Q 920,540 820,520 Q 720,530 660,480 Q 610,430 620,370 Q 630,320 680,290 Z" fill="#8a6e3a" opacity="0.7" />

  
  <path d="M 1140,300 Q 1180,290 1200,330 Q 1210,370 1190,410 Q 1170,430 1150,420 Q 1130,400 1130,360 Q 1125,330 1140,300 Z" fill="#7a5c2a" opacity="0.5" />

  
  <path d="M 200,300 Q 280,270 360,290 Q 420,310 440,370 Q 430,420 380,440 Q 300,460 240,430 Q 180,400 180,350 Q 185,320 200,300 Z" fill="#9a8050" opacity="0.5" />

  
