  <rect x="70" y="590" width="660" height="340" rx="4" ry="4" fill="none" stroke="#7a5c2a" stroke-width="1" opacity="0.5" />

  
  <g stroke="#7a5c2a" stroke-width="1.5" fill="none" opacity="0.7">
