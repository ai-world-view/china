  <g fill="#8a7040" opacity="0.5">
    <polygon points="620,680 640,645 660,680" />
    <polygon points="655,678 678,638 701,678" />
    <polygon points="690,682 715,642 740,682" />
    <polygon points="725,676 748,636 771,676" />
