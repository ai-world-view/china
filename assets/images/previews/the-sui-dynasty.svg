  <path d="M280,540 Q350,520 430,530 Q510,540 580,510 Q650,480 720,490 Q800,502 860,480 Q910,462 950,470 Q990,478 1030,500 Q1060,518 1080,540" fill="none" stroke="#5c8099" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  
  <path d="M300,300 Q380,280 460,290 Q530,300 580,270 Q640,240 710,260 Q780,280 830,260 Q880,242 930,260 Q970,275 1000,300" fill="none" stroke="#5c8099" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  
  
  <path d="M740,780 Q760,700 758,620 Q756,540 750,490 Q745,450 748,390 Q751,330 755,270 Q758,210 760,150" fill="none" stroke="#4a7a9b" stroke-width="10" stroke-linecap="round" stroke-dasharray="0" opacity="0.9" />
  
  <path d="M740,780 Q760,700 758,620 Q756,540 750,490 Q745,450 748,390 Q751,330 755,270 Q758,210 760,150" fill="none" stroke="#a0c8e0" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  
  <text x="775" y="480" font-family="Georgia, serif" font-size="18" fill="#2a4a60" opacity="0.85" transform="rotate(-88 775 480)" letter-spacing="2">大運河  Grand Canal</text>

  
  
  <circle cx="750" cy="390" r="10" fill="#6b3a1f" stroke="#c8a060" stroke-width="2" />
  <circle cx="750" cy="390" r="4" fill="#f0d080" />
  
  <circle cx="640" cy="370" r="10" fill="#6b3a1f" stroke="#c8a060" stroke-width="2" />
  <circle cx="640" cy="370" r="4" fill="#f0d080" />
  
  <circle cx="820" cy="590" r="8" fill="#6b3a1f" stroke="#c8a060" stroke-width="1.5" />
  <circle cx="820" cy="590" r="3" fill="#f0d080" />

  
  <text x="762" y="380" font-family="Georgia, serif" font-size="16" fill="#2a1a00" opacity="0.9">Luoyang</text>
  <text x="610" y="358" font-family="Georgia, serif" font-size="16" fill="#2a1a00" opacity="0.9">Chang'an</text>
  <text x="832" y="588" font-family="Georgia, serif" font-size="14" fill="#2a1a00" opacity="0.8">Jiankang</text>

  
  <text x="530" y="472" font-family="Georgia, serif" font-size="14" fill="#3a6080" opacity="0.8" transform="rotate(-5 530 472)">Yangtze River</text>
  <text x="480" y="278" font-family="Georgia, serif" font-size="14" fill="#3a6080" opacity="0.8" transform="rotate(-3 480 278)">Yellow River</text>

  
  <g transform="translate(1060, 820)" opacity="0.75">
    
    <circle r="55" fill="none" stroke="#6b5530" stroke-width="1.5" />
    <circle r="48" fill="none" stroke="#6b5530" stroke-width="0.5" />
    
    <polygon points="0,-55 -8,-18 0,-25 8,-18" fill="#6b3a1f" />
    <polygon points="0,55 -8,18 0,25 8,18" fill="#6b5530" />
    <polygon points="-55,0 -18,-8 -25,0 -18,8" fill="#6b5530" />
    <polygon points="55,0 18,-8 25,0 18,8" fill="#6b5530" />
    
    <text x="-5" y="-30" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#2a1a00">N</text>
    
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="#6b5530" stroke-width="0.8" opacity="0.5" />
    <line x1="38" y1="-38" x2="-38" y2="38" stroke="#6b5530" stroke-width="0.8" opacity="0.5" />
    <circle r="6" fill="#c8a060" stroke="#6b3a1f" stroke-width="1" />
