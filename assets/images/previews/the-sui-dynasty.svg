<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Sui Dynasty – Historical Banner</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b5" />
      <stop offset="100%" stop-color="#c9b87a" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cfa8" />
      <stop offset="100%" stop-color="#8faa7c" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a9eb5" />
      <stop offset="100%" stop-color="#5c8099" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b87a" />
      <stop offset="100%" stop-color="#a89550" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0f00" stop-opacity="0.72" />
      <stop offset="45%" stop-color="#1a0f00" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#1a0f00" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#8a7040" stroke-width="0.4" opacity="0.35" />
    </pattern>
    <pattern id="hatchPattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b5530" stroke-width="0.5" opacity="0.2" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#parchment)" />
  
  <rect width="1536" height="1024" fill="url(#gridPattern)" />
  
  <rect width="1536" height="1024" fill="url(#hatchPattern)" />

  
  <ellipse cx="1380" cy="400" rx="220" ry="300" fill="url(#waterGrad)" opacity="0.7" />
  <ellipse cx="1450" cy="750" rx="180" ry="180" fill="url(#waterGrad)" opacity="0.6" />
  
  <path d="M1100,200 Q1180,250 1200,350 Q1220,450 1180,550 Q1140,630 1100,680 L1060,680 Q1090,600 1100,500 Q1110,380 1060,280 Z" fill="url(#waterGrad)" opacity="0.55" />

  
  <path d="M260,80 L420,60 L580,75 L700,55 L820,80 L920,70 L1020,110 L1080,160 L1100,220 L1060,280 L1080,350 L1060,430 L1000,500 L980,580 L950,640 L900,700 L840,760 L780,800 L700,840 L620,870 L540,860 L460,830 L380,790 L300,720 L240,650 L200,560 L190,460 L210,360 L230,260 L240,160 Z" fill="url(#landGrad)" />

  
  <path d="M300,200 Q400,180 500,200 Q600,220 700,200 Q800,180 900,210 Q950,230 980,280" fill="none" stroke="#8a6e30" stroke-width="1.2" opacity="0.3" />
  <path d="M280,350 Q400,330 550,360 Q680,385 800,360 Q880,345 940,380" fill="none" stroke="#8a6e30" stroke-width="1" opacity="0.25" />
  <path d="M260,480 Q380,460 520,490 Q660,515 780,490 Q870,470 930,510" fill="none" stroke="#8a6e30" stroke-width="1" opacity="0.2" />

  
  <g fill="#8a7040" opacity="0.6">
    <polygon points="580,160 600,120 620,160" />
    <polygon points="615,155 640,110 665,155" />
