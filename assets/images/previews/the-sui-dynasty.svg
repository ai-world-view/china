  <g transform="translate(320, 900)" opacity="0.7">
    <rect x="0" y="0" width="120" height="8" fill="#6b5530" />
    <rect x="120" y="0" width="120" height="8" fill="#e8d9b5" stroke="#6b5530" stroke-width="1" />
    <text x="0" y="22" font-family="Georgia, serif" font-size="13" fill="#2a1a00">0</text>
    <text x="110" y="22" font-family="Georgia, serif" font-size="13" fill="#2a1a00">500</text>
    <text x="225" y="22" font-family="Georgia, serif" font-size="13" fill="#2a1a00">1000 km</text>
  </g>

  
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#6b5530" stroke-width="3" opacity="0.6" />
  <rect x="26" y="26" width="1484" height="972" fill="none" stroke="#6b5530" stroke-width="1" opacity="0.4" />

  
  <rect x="0" y="0" width="1536" height="1024" fill="url(#overlayGrad)" />

  
  <text x="80" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="bold" fill="#f5e9c8" letter-spacing="4" opacity="0.97">The Sui</text>
  <text x="80" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="bold" fill="#f5e9c8" letter-spacing="4" opacity="0.97">Dynasty</text>

  
  <text x="82" y="410" font-family="Georgia, serif" font-size="34" fill="#c8a060" letter-spacing="6" opacity="0.9">581 – 618 CE</text>

  
  <line x1="82" y1="438" x2="480" y2="438" stroke="#c8a060" stroke-width="2" opacity="0.7" />

  
  <text x="82" y="478" font-family="Georgia, serif" font-size="22" fill="#e8d5a8" opacity="0.85">Reunification · Grand Canal · Imperial Reform</text>

  
  <text x="82" y="530" font-family="Georgia, serif" font-size="18" fill="#c8b880" opacity="0.75">Emperor Wen  ·  Emperor Yang  ·  Li Yuan</text>

  
  <text x="82" y="720" font-family="serif" font-size="130" fill="#c8a060" opacity="0.18" letter-spacing="10">隋朝</text>

  
  <rect x="82" y="870" width="130" height="36" fill="#6b3a1f" opacity="0.85" />
  <text x="96" y="894" font-family="Georgia, serif" font-size="18" fill="#f5e9c8" letter-spacing="2">HISTORY</text>

</svg>