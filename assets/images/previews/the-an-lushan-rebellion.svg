  <text x="90" y="940" font-family="Georgia, serif" font-size="12" fill="#6a4a2a" font-style="italic">
    The rebellion shattered Tang Dynasty unity and accelerated the rise of regional autonomy
  </text>

  
  <text x="620" y="155" font-family="Georgia, serif" font-size="13" fill="#5a3a20" font-style="italic" opacity="0.7" transform="rotate(-5,620,155)">FRONTIER ZONE</text>
