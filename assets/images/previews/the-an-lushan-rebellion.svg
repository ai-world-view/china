    <text x="90" y="472" font-size="17" font-weight="bold">An Lushan</text>
    <text x="90" y="492" font-size="12" fill="#6a4a2a">Half-Turkish · Half-Sogdian · Tang General</text>

    <line x1="90" y1="508" x2="370" y2="508" stroke="#9a7c5a" stroke-width="0.8" />

    <text x="90" y="530" font-size="13" font-style="italic" fill="#6a4a2a">Estimated Population Loss:</text>
    <text x="90" y="556" font-size="24" font-weight="bold" fill="#8b2500">35 Million</text>
    <text x="90" y="574" font-size="12" fill="#6a4a2a">52.9M (754 CE) → 16.9M (764 CE)</text>

    <line x1="90" y1="590" x2="370" y2="590" stroke="#9a7c5a" stroke-width="0.8" />

    <text x="90" y="612" font-size="13" font-style="italic" fill="#6a4a2a">Duration:</text>
    <text x="90" y="635" font-size="20" font-weight="bold">8 Years of Warfare</text>

    <line x1="90" y1="652" x2="370" y2="652" stroke="#9a7c5a" stroke-width="0.8" />

    <text x="90" y="674" font-size="13" font-style="italic" fill="#6a4a2a">Legacy:</text>
    <text x="90" y="696" font-size="14">Rise of the Jiedushi</text>
    <text x="90" y="714" font-size="14">(Regional Military Governors)</text>
    <text x="90" y="736" font-size="13" fill="#5a3a20">End of Tang's Golden Age</text>
  </g>

  
