<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Han Dynasty — Banner Illustration</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b5" />
      <stop offset="100%" stop-color="#d4bc87" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b88a" />
      <stop offset="100%" stop-color="#e0cfa0" />
    </linearGradient>
    <linearGradient id="seagrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8faabc" />
      <stop offset="100%" stop-color="#6b8fa3" />
    </linearGradient>
    <linearGradient id="overlaygrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1a08" stop-opacity="0.82" />
      <stop offset="45%" stop-color="#2a1a08" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2a1a08" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b89c5a" stroke-width="0.4" stroke-opacity="0.4" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7a9ab0" stroke-width="0.5" stroke-opacity="0.35" />
      <line x1="0" y1="0" x2="8" y2="0" stroke="#7a9ab0" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  
