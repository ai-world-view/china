  <path d="M1020,500 L1100,480 L1160,520 L1180,580 L1150,620 L1100,640 L1050,620 L1010,570 Z" fill="#c4b480" stroke="#9a8a68" stroke-width="1" />
  
  <path d="M1240,340 L1270,360 L1260,410 L1240,430 L1220,410 L1230,370 Z" fill="#c8b98a" stroke="#9a8a68" stroke-width="1" />
  <path d="M1300,310 L1330,320 L1340,360 L1320,390 L1295,370 L1290,340 Z" fill="#c8b98a" stroke="#9a8a68" stroke-width="1" />

  
  <path d="M860,320 L980,360 L1020,420 L960,460 L940,500 L1020,500 L1060,540 L1080,600 L1040,650 L980,680 L920,680 L880,720 L840,720 L800,700 L830,720 L800,700 L780,640 L770,560 L790,490 L820,450 L760,410 L760,370 Z" fill="url(#chinagrad)" stroke="#7a1a0e" stroke-width="2" opacity="0.88" />

  
