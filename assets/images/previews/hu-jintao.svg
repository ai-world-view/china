  <rect x="18" y="18" width="1500" height="988" rx="3" fill="none" stroke="#8a7050" stroke-width="3" />
  <rect x="26" y="26" width="1484" height="972" rx="2" fill="none" stroke="#8a7050" stroke-width="1" />

  
  <rect x="0" y="0" width="600" height="1024" fill="url(#panelgrad)" />

  
  <line x1="60" y1="220" x2="520" y2="220" stroke="#c8a842" stroke-width="1.5" />
  <line x1="60" y1="228" x2="520" y2="228" stroke="#c8a842" stroke-width="0.5" />

  <line x1="60" y1="560" x2="520" y2="560" stroke="#c8a842" stroke-width="1.5" />
  <line x1="60" y1="568" x2="520" y2="568" stroke="#c8a842" stroke-width="0.5" />

  
  <text x="60" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="bold" fill="#f0e6d0" letter-spacing="-2">Hu</text>
  <text x="60" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="bold" fill="#f0e6d0" letter-spacing="-2">Jintao</text>

  
  <text x="62" y="510" font-family="Georgia, serif" font-size="22" fill="#c8a842" letter-spacing="3">PARAMOUNT LEADER OF CHINA</text>
  <text x="62" y="540" font-family="Georgia, serif" font-size="18" fill="#c8b882" letter-spacing="2">2002 – 2012</text>

  
  <text x="62" y="620" font-family="Georgia, serif" font-size="15" fill="#d4c9a8" opacity="0.85" letter-spacing="1">Harmonious Society  ·  Scientific Outlook on Development</text>
  <text x="62" y="648" font-family="Georgia, serif" font-size="15" fill="#d4c9a8" opacity="0.85" letter-spacing="1">General Secretary  ·  President  ·  CPC Central Military Commission</text>

  
  <g transform="translate(80,750)">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#c8a842" stroke-width="2" transform="rotate(45,20,20)" />
    <rect x="6" y="6" width="28" height="28" fill="none" stroke="#c8a842" stroke-width="1" transform="rotate(45,20,20)" />
    <circle cx="20" cy="20" r="5" fill="#c8a842" />
  </g>

  
  <g transform="translate(140,740)" fill="#c8a842">
    <polygon points="18,0 21,10 31,10 23,16 26,26 18,20 10,26 13,16 5,10 15,10" />
    <g transform="translate(42,4)" opacity="0.7">
      <polygon points="8,0 10,6 16,6 11,9 13,15 8,11 3,15 5,9 0,6 6,6" />
    </g>
