    <polygon points="0,-42 6,-18 0,-28 -6,-18" fill="#c0392b" />
    <polygon points="0,42 6,18 0,28 -6,18" fill="#8a7a5a" />
    <polygon points="42,0 18,6 28,0 18,-6" fill="#8a7a5a" />
    <polygon points="-42,0 -18,6 -28,0 -18,-6" fill="#8a7a5a" />
    
    <polygon points="30,-30 14,-10 20,-20 10,-14" fill="#b8a882" />
    <polygon points="30,30 10,14 20,20 14,10" fill="#b8a882" />
    <polygon points="-30,30 -14,10 -20,20 -10,14" fill="#b8a882" />
    <polygon points="-30,-30 -10,-14 -20,-20 -14,-10" fill="#b8a882" />
    <circle r="5" fill="#c0392b" />
    
    <text x="0" y="-50" font-family="Georgia,serif" font-size="13" fill="#5a4a2a" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="62" font-family="Georgia,serif" font-size="11" fill="#5a4a2a" text-anchor="middle">S</text>
