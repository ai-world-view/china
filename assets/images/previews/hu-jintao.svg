      <polygon points="8,0 10,6 16,6 11,9 13,15 8,11 3,15 5,9 0,6 6,6" />
    </g>
  </g>

  
  <rect x="0" y="940" width="1536" height="84" fill="#2c1a0e" opacity="0.75" />
  <text x="60" y="990" font-family="Georgia, serif" font-size="16" fill="#d4c9a8" letter-spacing="2" opacity="0.9">TSINGHUA UNIVERSITY  ·  GANSU PROVINCE  ·  BEIJING  ·  1942 – PRESENT  ·  PEOPLE'S REPUBLIC OF CHINA</text>

  
  <g transform="translate(1300,960)">
    <line x1="0" y1="10" x2="160" y2="10" stroke="#c8a882" stroke-width="1.5" />
    <line x1="0" y1="5" x2="0" y2="15" stroke="#c8a882" stroke-width="1.5" />
    <line x1="80" y1="7" x2="80" y2="13" stroke="#c8a882" stroke-width="1" />
    <line x1="160" y1="5" x2="160" y2="15" stroke="#c8a882" stroke-width="1.5" />
    <rect x="0" y="8" width="80" height="4" fill="#8a7050" />
    <rect x="80" y="8" width="80" height="4" fill="#c8a882" />
    <text x="80" y="26" font-family="Georgia,serif" font-size="11" fill="#c8a882" text-anchor="middle">SCALE</text>
