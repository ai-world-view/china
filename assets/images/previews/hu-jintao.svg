<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Hu Jintao – Paramount Leader of China 2002–2012</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="mapwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cdd6" />
      <stop offset="100%" stop-color="#9fbcca" />
    </linearGradient>
    <linearGradient id="chinagrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#96281b" />
    </linearGradient>
    <linearGradient id="panelgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c1a0e" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#2c1a0e" stop-opacity="0.0" />
    </linearGradient>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="gray" />
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend" />
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />

  
  <g stroke="#b8a882" stroke-width="0.6" opacity="0.5">
    
    <line x1="0" y1="170" x2="1536" y2="170" />
    <line x1="0" y1="340" x2="1536" y2="340" />
    <line x1="0" y1="512" x2="1536" y2="512" />
    <line x1="0" y1="682" x2="1536" y2="682" />
    <line x1="0" y1="852" x2="1536" y2="852" />
    
    <line x1="192" y1="0" x2="192" y2="1024" />
    <line x1="384" y1="0" x2="384" y2="1024" />
    <line x1="576" y1="0" x2="576" y2="1024" />
    <line x1="768" y1="0" x2="768" y2="1024" />
    <line x1="960" y1="0" x2="960" y2="1024" />
    <line x1="1152" y1="0" x2="1152" y2="1024" />
    <line x1="1344" y1="0" x2="1344" y2="1024" />
  </g>

  
  <rect x="400" y="80" width="1100" height="870" rx="4" fill="url(#mapwater)" opacity="0.6" />

  
  
  <path d="M560,85 L1450,85 L1450,320 L1300,300 L1200,340 L1100,310 L980,360 L860,320 L760,370 L660,330 L580,360 L520,300 Z" fill="#c8b98a" stroke="#9a8a68" stroke-width="1.2" />
  
  <path d="M760,370 L980,360 L1020,420 L960,460 L820,450 L760,410 Z" fill="#c4b480" stroke="#9a8a68" stroke-width="1" />
  
