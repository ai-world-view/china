  <text x="760" y="640" font-family="Georgia, serif" font-size="26" fill="#4a3010" text-anchor="middle" font-style="italic" opacity="0.8">楚</text>

  
  <circle cx="1350" cy="512" r="140" fill="url(#sealGrad)" opacity="0.9" />
  <circle cx="1350" cy="512" r="132" fill="none" stroke="#c04040" stroke-width="3" />
  <circle cx="1350" cy="512" r="124" fill="none" stroke="#d06060" stroke-width="1" />

  
  <text x="1350" y="490" font-family="Georgia, serif" font-size="72" fill="#f0d090" text-anchor="middle" dominant-baseline="middle" font-weight="bold">皇</text>
  <text x="1350" y="558" font-family="Georgia, serif" font-size="30" fill="#f0c060" text-anchor="middle">帝</text>

  
  <path id="sealRing" d="M 1350,512 m -118,0 a 118,118 0 1,1 236,0 a 118,118 0 1,1 -236,0" fill="none" />
  <text font-family="Georgia, serif" font-size="13" fill="#f0c060" letter-spacing="3">
    <textPath href="#sealRing" startOffset="5%">· QIN SHI HUANG · FIRST EMPEROR · 221 BCE ·</textPath>
  </text>

  
  <g transform="translate(200, 720)">
    
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#7a6030" stroke-width="1.5" />
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#7a6030" stroke-width="1.5" />
    
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#7a6030" stroke-width="1" />
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#7a6030" stroke-width="1" />
    
    <polygon points="0,-70 -12,-30 0,-45 12,-30" fill="#8b2020" />
    <polygon points="0,70 -12,30 0,45 12,30" fill="#7a6030" />
    <polygon points="-70,0 -30,-12 -45,0 -30,12" fill="#7a6030" />
    <polygon points="70,0 30,-12 45,0 30,12" fill="#7a6030" />
    
    <circle cx="0" cy="0" r="10" fill="#e8dcc8" stroke="#7a6030" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#8b2020" />
    
    <text x="0" y="-78" font-family="Georgia, serif" font-size="18" fill="#4a3010" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="96" font-family="Georgia, serif" font-size="16" fill="#4a3010" text-anchor="middle">S</text>
    <text x="84" y="5" font-family="Georgia, serif" font-size="16" fill="#4a3010" text-anchor="start">E</text>
    <text x="-84" y="5" font-family="Georgia, serif" font-size="16" fill="#4a3010" text-anchor="end">W</text>
  </g>

  
  <line x1="60" y1="100" x2="1476" y2="100" stroke="#7a6030" stroke-width="1" opacity="0.5" />

  
  <line x1="60" y1="100" x2="60" y2="924" stroke="#7a6030" stroke-width="1" opacity="0.4" />
  <line x1="440" y1="100" x2="440" y2="924" stroke="#7a6030" stroke-width="0.5" opacity="0.3" />

  
  <text x="250" y="205" font-family="Georgia, serif" font-size="88" fill="#2a1a05" text-anchor="middle" font-weight="bold" letter-spacing="2">QIN SHI</text>
  <text x="250" y="310" font-family="Georgia, serif" font-size="88" fill="#2a1a05" text-anchor="middle" font-weight="bold" letter-spacing="2">HUANG</text>

  
  <text x="250" y="390" font-family="Georgia, serif" font-size="52" fill="#7a3010" text-anchor="middle" letter-spacing="8">秦始皇</text>

  
  <line x1="90" y1="415" x2="410" y2="415" stroke="#7a6030" stroke-width="2" />
  <circle cx="250" cy="415" r="5" fill="#8b2020" />

  
  <text x="250" y="455" font-family="Georgia, serif" font-size="20" fill="#5a4020" text-anchor="middle" font-style="italic">First Emperor of Unified China</text>
  <text x="250" y="485" font-family="Georgia, serif" font-size="18" fill="#5a4020" text-anchor="middle">259 – 210 BCE</text>

  
  <rect x="90" y="505" width="320" height="44" fill="#7a3010" rx="3" />
  <text x="250" y="533" font-family="Georgia, serif" font-size="18" fill="#f0d090" text-anchor="middle" letter-spacing="1">QIN DYNASTY  221–206 BCE</text>

  
  <text x="100" y="590" font-family="Georgia, serif" font-size="15" fill="#4a3010">▸ Born: Ying Zheng, Handan, 259 BCE</text>
  <text x="100" y="615" font-family="Georgia, serif" font-size="15" fill="#4a3010">▸ Throne at age 13 (246 BCE)</text>
  <text x="100" y="640" font-family="Georgia, serif" font-size="15" fill="#4a3010">▸ Conquered 6 rival states (230–221)</text>
  <text x="100" y="665" font-family="Georgia, serif" font-size="15" fill="#4a3010">▸ Standardized script, weights, currency</text>
  <text x="100" y="690" font-family="Georgia, serif" font-size="15" fill="#4a3010">▸ Built the Great Wall</text>

  
  <line x1="60" y1="924" x2="1476" y2="924" stroke="#7a6030" stroke-width="1" opacity="0.5" />

  
  <text x="768" y="970" font-family="Georgia, serif" font-size="16" fill="#6a5030" text-anchor="middle" font-style="italic" letter-spacing="3">ATLAS OF IMPERIAL CHINA  ·  WARRING STATES TO UNIFIED EMPIRE</text>

  
  <rect x="565" y="760" width="530" height="36" fill="#7a5030" opacity="0.8" rx="2" />
  <text x="830" y="784" font-family="Georgia, serif" font-size="16" fill="#f0d090" text-anchor="middle" letter-spacing="2">THE SEVEN STATES AT UNIFICATION  c. 221 BCE</text>

  
  <line x1="620" y1="810" x2="820" y2="810" stroke="#4a3010" stroke-width="2" />
  <line x1="620" y1="804" x2="620" y2="816" stroke="#4a3010" stroke-width="2" />
  <line x1="820" y1="804" x2="820" y2="816" stroke="#4a3010" stroke-width="2" />
  <text x="720" y="830" font-family="Georgia, serif" font-size="13" fill="#4a3010" text-anchor="middle">Scale (approx.)</text>

  
  <text x="760" y="195" font-family="Georgia, serif" font-size="13" fill="#7a5030" text-anchor="middle" font-style="italic">― ― Great Wall ― ―</text>

</svg>