<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Qin Shi Huang – First Emperor of Unified China</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </linearGradient>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c49a" />
      <stop offset="100%" stop-color="#b8a872" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b2020" />
      <stop offset="100%" stop-color="#5c1010" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a820" />
      <stop offset="100%" stop-color="#9a7010" />
    </linearGradient>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
    </filter>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  
  <rect width="1536" height="1024" fill="#c4a85a" opacity="0.12" />

  
