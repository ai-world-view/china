<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Standing Committee of the Politburo — Atlas-style banner</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="chinaFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9b98a" />
      <stop offset="100%" stop-color="#b8a870" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b1a1a" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b1111" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#3d0a0a" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="hatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#b8a870" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#7a6a40" fill-opacity="0.3" />
    </pattern>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grey" />
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <clipPath id="bannerClip">
      <rect width="1536" height="1024" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

  
  <rect width="1536" height="1024" fill="url(#parchment)" />
