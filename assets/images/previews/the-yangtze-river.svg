      <stop offset="50%" stop-color="#2a2015" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#2a2015" stop-opacity="0.15" />
    </linearGradient>
    <filter id="parchment" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="gridPat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#8a7455" stroke-width="0.4" opacity="0.4" />
