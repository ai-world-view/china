<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Yangtze River — Atlas Banner</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6c9a8" />
      <stop offset="100%" stop-color="#e8dfc0" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a7fa5" />
      <stop offset="40%" stop-color="#5b9ec9" />
      <stop offset="100%" stop-color="#7bb8d4" />
    </linearGradient>
    <linearGradient id="plateauGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89070" />
      <stop offset="100%" stop-color="#c4aa85" />
    </linearGradient>
    <linearGradient id="gorgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6a55" />
      <stop offset="100%" stop-color="#5c5040" />
