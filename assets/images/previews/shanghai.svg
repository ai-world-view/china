<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Shanghai – Asia's Most Economically Dynamic Metropolis</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b99a" />
      <stop offset="100%" stop-color="#e8d9bf" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa3b8" />
      <stop offset="100%" stop-color="#5b8fa8" />
    </linearGradient>
    <linearGradient id="rivergrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa3b8" />
      <stop offset="100%" stop-color="#6898ae" />
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b0956e" stroke-width="0.5" opacity="0.3" />
    </pattern>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut" />
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  
