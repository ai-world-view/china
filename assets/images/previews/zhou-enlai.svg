  <text x="100" y="750" font-family="Georgia, serif" font-size="14" fill="#c8b88a">· Premier of the PRC (1949–1976)</text>
  <text x="100" y="772" font-family="Georgia, serif" font-size="14" fill="#c8b88a">· Foreign Minister (1949–1958)</text>
  <text x="100" y="794" font-family="Georgia, serif" font-size="14" fill="#c8b88a">· CCP Politburo Standing Committee</text>
  <text x="100" y="816" font-family="Georgia, serif" font-size="14" fill="#c8b88a">· Lead diplomat, US–China rapprochement</text>

  
