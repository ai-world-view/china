  <line x1="100" y1="462" x2="620" y2="462" stroke="#6a5030" stroke-width="0.8" opacity="0.5" />

  
  <text x="100" y="490" font-family="Georgia, serif" font-size="14" fill="#9e9070" letter-spacing="1">BORN</text>
  <text x="160" y="490" font-family="Georgia, serif" font-size="14" fill="#c8b88a">March 5, 1898 · Huaian, Jiangsu</text>
  <text x="100" y="514" font-family="Georgia, serif" font-size="14" fill="#9e9070" letter-spacing="1">DIED</text>
  <text x="160" y="514" font-family="Georgia, serif" font-size="14" fill="#c8b88a">January 8, 1976 · Beijing</text>

  
  <line x1="100" y1="535" x2="620" y2="535" stroke="#6a5030" stroke-width="0.8" opacity="0.5" />

  
  <text x="100" y="572" font-family="Georgia, serif" font-size="16" fill="#b0a080" font-style="italic" opacity="0.9">
    <tspan x="100" dy="0">"A founding leader of the Chinese Communist</tspan>
    <tspan x="100" dy="24">Party, Zhou became known for his diplomatic</tspan>
    <tspan x="100" dy="24">skill and organizational acumen — architect</tspan>
    <tspan x="100" dy="24">of China's foreign policy and the rapprochement</tspan>
    <tspan x="100" dy="24">with the United States in 1971."</tspan>
  </text>

  
