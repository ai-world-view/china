  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc8" />
      <stop offset="100%" stop-color="#d4c4a0" />
    </linearGradient>
    <linearGradient id="mapgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b88a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a09060" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="panelgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c1a0e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3d2510" stop-opacity="0.75" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a09060" stroke-width="0.4" stroke-opacity="0.3" />
    </pattern>
    <filter id="aged">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
  </defs>

  
