    </pattern>

    
    <radialGradient id="sealGrad" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#c04030" />
      <stop offset="100%" stop-color="#7a1a10" />
    </radialGradient>

    
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2810" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1e1408" stop-opacity="0.92" />
    </linearGradient>

    
    <radialGradient id="vignette" cx="50%" cy="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>
  </defs>

  
