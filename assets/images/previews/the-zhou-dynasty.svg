  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b5" />
      <stop offset="100%" stop-color="#c9b47a" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5c9a8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8faa80" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="titlebox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2a10" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#5c3d18" stop-opacity="0.85" />
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
