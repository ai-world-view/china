      <line x1="0" y1="4" x2="8" y2="4" stroke="#5a7a8a" stroke-width="0.3" stroke-opacity="0.15" />
    </pattern>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6830" />
      <stop offset="100%" stop-color="#5a4a20" />
    </linearGradient>
    <linearGradient id="titlePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1e08" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#1a1005" stop-opacity="0.90" />
    </linearGradient>
  </defs>

  
