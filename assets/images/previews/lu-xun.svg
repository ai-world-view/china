    <linearGradient id="highlightLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8b060" />
      <stop offset="100%" stop-color="#a89040" />
    </linearGradient>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7a40" stroke-width="0.4" stroke-opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
