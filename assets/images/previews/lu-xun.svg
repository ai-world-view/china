  <title>Lu Xun — Atlas Portrait Banner</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d9b0" />
      <stop offset="50%" stop-color="#d9c98a" />
      <stop offset="100%" stop-color="#c8b870" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aabb5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6b90a0" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8a96a" />
      <stop offset="100%" stop-color="#9a8a50" />
