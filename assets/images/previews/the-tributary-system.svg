      <path d="M0,0 L0,6 L8,3 z" fill="#7a5c1a" opacity="0.7" />
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a08030" stroke-width="0.4" opacity="0.3" />
    </pattern>
  </defs>

  
