<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Shang Dynasty — Bronze Age China, c. 1600–1046 BCE</title>
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc8" />
      <stop offset="100%" stop-color="#d4c4a0" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b898" />
      <stop offset="100%" stop-color="#e2d4b4" />
    </linearGradient>
    <linearGradient id="bronzegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6914" />
      <stop offset="100%" stop-color="#5c4510" />
    </linearGradient>
    <linearGradient id="vesselgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a07828" />
      <stop offset="100%" stop-color="#6b4c10" />
    </linearGradient>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b09060" stroke-width="0.5" opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#8b6820" stroke-width="0.4" opacity="0.25" />
      <line x1="10" y1="0" x2="0" y2="10" stroke="#8b6820" stroke-width="0.4" opacity="0.25" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#parch)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
