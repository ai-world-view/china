<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Agriculture and Land Reform – Banner Illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c49a" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c9a3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d4c49a" stop-opacity="0" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b8a870" stroke-width="0.5" opacity="0.4" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a7a50" stroke-width="0.4" opacity="0.3" />
      <line x1="0" y1="0" x2="10" y2="0" stroke="#8a7a50" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut" />
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <linearGradient id="fieldGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9e5a" />
      <stop offset="100%" stop-color="#5a7a3a" />
    </linearGradient>
    <linearGradient id="fieldBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8955a" />
      <stop offset="100%" stop-color="#8a6a30" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9a6a" />
      <stop offset="100%" stop-color="#6a7a4a" />
    </linearGradient>
  </defs>

  
